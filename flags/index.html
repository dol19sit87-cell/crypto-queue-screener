<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Flag Prep Screener</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b0e;
      --panel: #0e151b;
      --panel2: #0a1015;
      --line: #20303b;
      --text: #eff6f7;
      --muted: #91a1aa;
      --green: #31dd8d;
      --red: #ff6075;
      --amber: #f4bd53;
      --blue: #62a8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 11, 14, .96);
    }
    h1 { margin: 0 0 9px; font-size: 23px; letter-spacing: 0; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 13px; }
    .pill {
      min-height: 30px;
      border: 1px solid var(--line);
      background: #101a22;
      border-radius: 999px;
      padding: 7px 10px;
      white-space: nowrap;
    }
    main { padding: 12px 14px 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .2);
    }
    .card.long { border-color: rgba(49, 221, 141, .42); }
    .card.short { border-color: rgba(255, 96, 117, .46); }
    .chart-stack { display: grid; grid-template-rows: 1fr 1fr; min-height: min(62vh, 560px); }
    .chart {
      min-height: min(31vh, 280px);
      position: relative;
      border-bottom: 1px solid #1a2730;
      background:
        linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px);
      background-size: 100% 25%, 16.6% 100%;
    }
    .chart:last-child { border-bottom: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .tag, .price {
      position: absolute;
      top: 9px;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(7, 10, 13, .78);
      font-size: 11px;
      font-weight: 840;
    }
    .tag { left: 10px; color: var(--muted); }
    .price { right: 10px; }
    .body { padding: 9px 10px 10px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    h2 { margin: 0; font-size: 18px; line-height: 1; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 7px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .badge.long { color: var(--green); border-color: rgba(49,221,141,.58); }
    .badge.short { color: var(--red); border-color: rgba(255,96,117,.58); }
    .badge.breakout { color: var(--amber); border-color: rgba(244,189,83,.62); }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
    .metric { min-width: 0; border: 1px solid #1a2730; border-radius: 6px; background: rgba(255,255,255,.025); padding: 5px; }
    .label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 9px; line-height: 1.1; }
    .value { display: block; overflow-wrap: anywhere; font-size: 11px; font-weight: 780; line-height: 1.15; }
    .empty { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); padding: 24px; }
    footer { padding: 0 16px 16px; color: var(--muted); font-size: 12px; }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .chart-stack { min-height: 450px; }
      .chart { min-height: 225px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Flag Prep Screener</h1>
    <div class="summary" id="summary"><div class="pill">Загрузка data.json...</div></div>
  </header>
  <main><section class="grid" id="grid"></section></main>
  <footer>Это observer/paper screener: импульс старшего ТФ + проторговка минимум 20 минут. Не является рекомендацией к сделке.</footer>
  <script>
    const summary = document.getElementById("summary");
    const grid = document.getElementById("grid");
    const dataSources = [
      { type: "github-api", url: "https://api.github.com/repos/dol19sit87-cell/crypto-queue-screener/contents/flags/data.json?ref=main" },
      { type: "json", url: "https://raw.githubusercontent.com/dol19sit87-cell/crypto-queue-screener/main/flags/data.json" },
      { type: "json", url: "data.json" }
    ];
    const fmt = (value, digits = 2) => {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return n.toFixed(digits);
    };
    const compactPrice = (value) => {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      if (n >= 100) return n.toFixed(2);
      if (n >= 1) return n.toFixed(4);
      if (n >= 0.01) return n.toFixed(5);
      return n.toPrecision(4);
    };
    const shortTime = (value) => {
      if (!value) return "-";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleString("ru-RU", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    };
    function metric(label, value) {
      return `<div class="metric"><span class="label">${label}</span><span class="value">${value}</span></div>`;
    }
    function renderSummary(data) {
      summary.innerHTML = [
        `Data: ${shortTime(data.updatedAt)}`,
        `Symbols: ${data.cards?.length ?? 0}`,
        `Forming: ${data.formingCount ?? 0}`,
        `Breakout: ${data.breakoutCount ?? 0}`,
        `Refresh: ${data.refreshMinutes ?? 1}m`
      ].map((x) => `<div class="pill">${x}</div>`).join("");
    }
    function renderCards(cards) {
      if (!cards.length) {
        grid.innerHTML = `<div class="empty">Сейчас нет монет, где одновременно есть импульс старшего ТФ и проторговка минимум 20 минут.</div>`;
        return;
      }
      grid.innerHTML = cards.map((card, index) => {
        const dir = String(card.direction || "").toLowerCase();
        const status = card.status === "BREAKOUT_WITH_IMPULSE" ? "BREAKOUT" : "FLAG FORMING";
        const statusCls = card.status === "BREAKOUT_WITH_IMPULSE" ? " breakout" : "";
        return `
          <article class="card ${dir}" data-index="${index}">
            <div class="chart-stack">
              <div class="chart">
                <canvas data-timeframe="m15" width="1380" height="520"></canvas>
                <div class="tag">M15 impulse</div>
                <div class="price">${compactPrice(card.lastPrice)}</div>
              </div>
              <div class="chart">
                <canvas data-timeframe="m5" width="1380" height="520"></canvas>
                <div class="tag">M5 consolidation</div>
              </div>
            </div>
            <div class="body">
              <div class="top">
                <div>
                  <h2>${card.symbol ?? "-"}</h2>
                  <div class="badges">
                    <span class="badge ${dir}">${card.direction ?? "-"}</span>
                    <span class="badge${statusCls}">${status}</span>
                  </div>
                </div>
              </div>
              <div class="metrics">
                ${metric("Impulse", `${fmt(card.impulseMovePct)}%`)}
                ${metric("Base time", `${fmt(card.consolidationMinutes, 0)}m`)}
                ${metric("Base width", `${fmt(card.consolidationWidthPct)}%`)}
                ${metric("Retrace", `${fmt(card.consolidationRetracePct, 1)}%`)}
                ${metric("Vol 24h", `${fmt(card.volume24hM, 1)}M`)}
                ${metric("Trades 15m", fmt(card.trades15m, 0))}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }
    function drawChart(canvas, candles, card, timeframe) {
      candles = Array.isArray(candles) ? candles : [];
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (!candles.length) return;
      const pad = { left: 16, right: 18, top: 14, bottom: 30 };
      const lows = candles.map((c) => Number(c.l));
      const highs = candles.map((c) => Number(c.h));
      let min = Math.min(...lows);
      let max = Math.max(...highs);
      const spread = max - min || max * .01 || 1;
      min -= spread * .08;
      max += spread * .08;
      const plotH = h - pad.top - pad.bottom;
      const step = (w - pad.left - pad.right) / candles.length;
      const bodyW = Math.max(3, Math.min(8, step * .58));
      const y = (p) => pad.top + ((max - p) / (max - min)) * plotH;
      candles.forEach((c, i) => {
        const x = pad.left + (i + .5) * step;
        const o = Number(c.o), hi = Number(c.h), lo = Number(c.l), cl = Number(c.c);
        const up = cl >= o;
        const color = up ? "#31dd8d" : "#ff6075";
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.35;
        ctx.beginPath();
        ctx.moveTo(x, y(hi));
        ctx.lineTo(x, y(lo));
        ctx.stroke();
        ctx.fillStyle = color;
        const top = y(Math.max(o, cl));
        const bottom = y(Math.min(o, cl));
        ctx.fillRect(x - bodyW / 2, top, bodyW, Math.max(2, bottom - top));
      });
      if (timeframe === "m5" && Number.isFinite(Number(card.consolidationHigh)) && Number.isFinite(Number(card.consolidationLow))) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(244,189,83,.95)";
        [Number(card.consolidationHigh), Number(card.consolidationLow)].forEach((level) => {
          ctx.beginPath();
          ctx.moveTo(pad.left, y(level));
          ctx.lineTo(w - pad.right, y(level));
          ctx.stroke();
        });
      }
    }
    function drawAll(cards) {
      document.querySelectorAll(".card").forEach((tile) => {
        const index = Number(tile.dataset.index);
        const card = cards[index] || {};
        drawChart(tile.querySelector('canvas[data-timeframe="m15"]'), card.candles15m, card, "m15");
        drawChart(tile.querySelector('canvas[data-timeframe="m5"]'), card.candles5m, card, "m5");
      });
    }
    async function fetchJson(source, stamp) {
      const join = source.url.includes("?") ? "&" : "?";
      const r = await fetch(`${source.url}${join}t=${stamp}`, { cache: "no-store" });
      if (!r.ok) throw new Error(`${source.url} HTTP ${r.status}`);
      if (source.type === "github-api") {
        const payload = await r.json();
        const clean = String(payload.content || "").replace(/\s/g, "");
        const binary = atob(clean);
        const bytes = Uint8Array.from(binary, (ch) => ch.charCodeAt(0));
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      }
      return r.json();
    }
    async function load() {
      try {
        const stamp = Date.now();
        let data = null;
        let lastError = null;
        for (const source of dataSources) {
          try {
            data = await fetchJson(source, stamp);
            break;
          } catch (error) {
            lastError = error;
          }
        }
        if (!data) throw lastError || new Error("data.json unavailable");
        const cards = Array.isArray(data.cards) ? data.cards : [];
        renderSummary(data);
        renderCards(cards);
        drawAll(cards);
      } catch (error) {
        summary.innerHTML = `<div class="pill">Ошибка data.json</div>`;
        grid.innerHTML = `<div class="empty">${error.message}</div>`;
      }
    }
    window.addEventListener("resize", load);
    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
