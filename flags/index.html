<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Flag Prep Screener</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b0e;
      --panel: #0e151b;
      --panel2: #0a1015;
      --line: #20303b;
      --text: #eff6f7;
      --muted: #91a1aa;
      --green: #31dd8d;
      --red: #ff6075;
      --amber: #f4bd53;
      --blue: #62a8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 11, 14, .96);
    }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    h1 { margin: 0; font-size: 23px; letter-spacing: 0; }
    .notify {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #101a22;
      color: var(--muted);
      padding: 7px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .notify.on { color: var(--amber); border-color: rgba(244,189,83,.72); }
    .notify:disabled { cursor: not-allowed; opacity: .65; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 13px; }
    .pill {
      min-height: 30px;
      border: 1px solid var(--line);
      background: #101a22;
      border-radius: 999px;
      padding: 7px 10px;
      white-space: nowrap;
    }
    main { padding: 12px 14px 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .2);
    }
    .card.long { border-color: rgba(49, 221, 141, .42); }
    .card.short { border-color: rgba(255, 96, 117, .46); }
    .card.new-card { box-shadow: 0 0 0 2px rgba(244,189,83,.82), 0 18px 36px rgba(244,189,83,.13); }
    .chart-stack { display: grid; grid-template-rows: 1fr 1fr; min-height: min(62vh, 560px); }
    .chart {
      min-height: min(31vh, 280px);
      position: relative;
      border-bottom: 1px solid #1a2730;
      background:
        linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px);
      background-size: 100% 25%, 16.6% 100%;
    }
    .chart:last-child { border-bottom: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .tag, .price {
      position: absolute;
      top: 9px;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(7, 10, 13, .78);
      font-size: 11px;
      font-weight: 840;
    }
    .tag { left: 10px; color: var(--muted); }
    .price { right: 10px; }
    .body { padding: 9px 10px 10px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    h2 { margin: 0; font-size: 18px; line-height: 1; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 7px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .badge.long { color: var(--green); border-color: rgba(49,221,141,.58); }
    .badge.short { color: var(--red); border-color: rgba(255,96,117,.58); }
    .badge.breakout { color: var(--amber); border-color: rgba(244,189,83,.62); }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
    .metric { min-width: 0; border: 1px solid #1a2730; border-radius: 6px; background: rgba(255,255,255,.025); padding: 5px; }
    .label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 9px; line-height: 1.1; }
    .value { display: block; overflow-wrap: anywhere; font-size: 11px; font-weight: 780; line-height: 1.15; }
    .empty { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); padding: 24px; }
    footer { padding: 0 16px 16px; color: var(--muted); font-size: 12px; }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .chart-stack { min-height: 450px; }
      .chart { min-height: 225px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="head">
      <h1>Flag Prep Screener</h1>
      <button class="notify" id="notifyButton" type="button">Включить сигнал</button>
    </div>
    <div class="summary" id="summary"><div class="pill">Загрузка data.json...</div></div>
  </header>
  <main><section class="grid" id="grid"></section></main>
  <footer>Это observer/paper screener: импульс старшего ТФ + проторговка минимум 20 минут внутри диапазона импульса. Не является рекомендацией к сделке.</footer>
  <script>
    const summary = document.getElementById("summary");
    const grid = document.getElementById("grid");
    const notifyButton = document.getElementById("notifyButton");
    const storageKey = "flag-prep-known-symbols-v1";
    const notifyKey = "flag-prep-notify-enabled-v1";
    let audioContext = null;
    let lastNewSymbols = [];
    const dataSources = [
      { type: "github-api", url: "https://api.github.com/repos/dol19sit87-cell/crypto-queue-screener/contents/flags/data.json?ref=main" },
      { type: "json", url: "https://raw.githubusercontent.com/dol19sit87-cell/crypto-queue-screener/main/flags/data.json" },
      { type: "json", url: "data.json" }
    ];
    const fmt = (value, digits = 2) => {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return n.toFixed(digits);
    };
    const compactPrice = (value) => {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      if (n >= 100) return n.toFixed(2);
      if (n >= 1) return n.toFixed(4);
      if (n >= 0.01) return n.toFixed(5);
      return n.toPrecision(4);
    };
    const shortTime = (value) => {
      if (!value) return "-";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleString("ru-RU", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    };
    function metric(label, value) {
      return `<div class="metric"><span class="label">${label}</span><span class="value">${value}</span></div>`;
    }
    function renderSummary(data) {
      summary.innerHTML = [
        `Data: ${shortTime(data.updatedAt)}`,
        `Symbols: ${data.cards?.length ?? 0}`,
        `Forming: ${data.formingCount ?? 0}`,
        `Breakout: ${data.breakoutCount ?? 0}`,
        `Refresh: ${data.refreshMinutes ?? 1}m`
      ].map((x) => `<div class="pill">${x}</div>`).join("");
    }
    function readKnownSymbols() {
      try {
        const raw = localStorage.getItem(storageKey);
        const values = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(values) ? values : []);
      } catch {
        return new Set();
      }
    }
    function saveKnownSymbols(symbols) {
      localStorage.setItem(storageKey, JSON.stringify([...symbols].sort()));
    }
    function notificationsEnabled() {
      return localStorage.getItem(notifyKey) === "1";
    }
    function updateNotifyButton() {
      const enabled = notificationsEnabled();
      notifyButton.classList.toggle("on", enabled);
      if (!("Notification" in window)) {
        notifyButton.textContent = enabled ? "Сигнал ON" : "Включить сигнал";
        return;
      }
      if (enabled && Notification.permission === "granted") {
        notifyButton.textContent = "Сигнал ON";
      } else if (Notification.permission === "denied") {
        notifyButton.textContent = "Звук ON, уведомления запрещены";
      } else {
        notifyButton.textContent = "Включить сигнал";
      }
    }
    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();
    }
    function playSignal() {
      try {
        ensureAudio();
        const now = audioContext.currentTime;
        [740, 980, 1240].forEach((freq, i) => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * .13);
          gain.gain.setValueAtTime(0.001, now + i * .13);
          gain.gain.exponentialRampToValueAtTime(0.18, now + i * .13 + .02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * .13 + .11);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(now + i * .13);
          osc.stop(now + i * .13 + .12);
        });
      } catch {}
    }
    function getNewCards(cards) {
      const symbols = new Set(cards.map((card) => card.symbol).filter(Boolean));
      const known = readKnownSymbols();
      const hasHistory = known.size > 0;
      const newCards = hasHistory ? cards.filter((card) => card.symbol && !known.has(card.symbol)) : [];
      saveKnownSymbols(symbols);
      return newCards;
    }
    function notifyNewSymbols(newCards) {
      if (!newCards.length || !notificationsEnabled()) return;
      playSignal();
      const symbols = newCards.map((card) => card.symbol).filter(Boolean);
      document.title = `NEW FLAGS: ${symbols.join(", ")}`;
      setTimeout(() => { document.title = "Flag Prep Screener"; }, 12000);
      if ("Notification" in window && Notification.permission === "granted") {
        const body = newCards.map((card) => `${card.symbol} - ${card.direction} - ${card.status}`).join("\n");
        new Notification("Новый флаг", { body });
      }
    }
    function renderCards(cards, newSymbols = []) {
      if (!cards.length) {
        grid.innerHTML = `<div class="empty">Сейчас нет монет, где одновременно есть импульс старшего ТФ и проторговка минимум 20 минут.</div>`;
        return;
      }
      const fresh = new Set(newSymbols);
      grid.innerHTML = cards.map((card, index) => {
        const dir = String(card.direction || "").toLowerCase();
        const status = card.status === "BREAKOUT_WITH_IMPULSE" ? "BREAKOUT" : "FLAG FORMING";
        const statusCls = card.status === "BREAKOUT_WITH_IMPULSE" ? " breakout" : "";
        const freshCls = fresh.has(card.symbol) ? " new-card" : "";
        return `
          <article class="card ${dir}${freshCls}" data-index="${index}">
            <div class="chart-stack">
              <div class="chart">
                <canvas data-timeframe="m15" width="1380" height="520"></canvas>
                <div class="tag">M15 impulse marked</div>
                <div class="price">${compactPrice(card.lastPrice)}</div>
              </div>
              <div class="chart">
                <canvas data-timeframe="m5" width="1380" height="520"></canvas>
                <div class="tag">M5 base zone</div>
              </div>
            </div>
            <div class="body">
              <div class="top">
                <div>
                  <h2>${card.symbol ?? "-"}</h2>
                  <div class="badges">
                    <span class="badge ${dir}">${card.direction ?? "-"}</span>
                    <span class="badge${statusCls}">${status}</span>
                  </div>
                </div>
              </div>
              <div class="metrics">
                ${metric("Impulse", `${fmt(card.impulseMovePct)}%`)}
                ${metric("Base time", `${fmt(card.consolidationMinutes, 0)}m`)}
                ${metric("Base width", `${fmt(card.consolidationWidthPct)}%`)}
                ${metric("Retrace", `${fmt(card.consolidationRetracePct, 1)}%`)}
                ${metric("Impulse box", `${compactPrice(card.impulseLow)}-${compactPrice(card.impulseHigh)}`)}
                ${metric("Trades 15m", fmt(card.trades15m, 0))}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }
    function drawChart(canvas, candles, card, timeframe) {
      candles = Array.isArray(candles) ? candles : [];
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (!candles.length) return;
      const pad = { left: 16, right: 18, top: 14, bottom: 30 };
      const lows = candles.map((c) => Number(c.l));
      const highs = candles.map((c) => Number(c.h));
      let min = Math.min(...lows);
      let max = Math.max(...highs);
      const spread = max - min || max * .01 || 1;
      min -= spread * .08;
      max += spread * .08;
      const plotH = h - pad.top - pad.bottom;
      const step = (w - pad.left - pad.right) / candles.length;
      const bodyW = Math.max(3, Math.min(8, step * .58));
      const y = (p) => pad.top + ((max - p) / (max - min)) * plotH;
      const xAt = (index) => pad.left + (index + .5) * step;
      const nearestIndex = (isoTime) => {
        const target = new Date(isoTime).getTime();
        if (!Number.isFinite(target)) return -1;
        let best = -1;
        let bestDelta = Infinity;
        candles.forEach((c, i) => {
          const delta = Math.abs(Number(c.t) - target);
          if (delta < bestDelta) {
            best = i;
            bestDelta = delta;
          }
        });
        return best;
      };
      const dirColor = String(card.direction).toUpperCase() === "SHORT" ? "#ff6075" : "#31dd8d";
      candles.forEach((c, i) => {
        const x = xAt(i);
        const o = Number(c.o), hi = Number(c.h), lo = Number(c.l), cl = Number(c.c);
        const up = cl >= o;
        const color = up ? "#31dd8d" : "#ff6075";
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.35;
        ctx.beginPath();
        ctx.moveTo(x, y(hi));
        ctx.lineTo(x, y(lo));
        ctx.stroke();
        ctx.fillStyle = color;
        const top = y(Math.max(o, cl));
        const bottom = y(Math.min(o, cl));
        ctx.fillRect(x - bodyW / 2, top, bodyW, Math.max(2, bottom - top));
      });
      if (timeframe === "m15") {
        const start = nearestIndex(card.impulseStartTime);
        const end = nearestIndex(card.impulseEndTime);
        if (start >= 0 && end >= start) {
          const startCandle = candles[start];
          const endCandle = candles[end];
          const x1 = xAt(start);
          const x2 = xAt(end);
          const y1 = y(Number(startCandle.o));
          const y2 = y(Number(endCandle.c));
          ctx.save();
          ctx.fillStyle = String(card.direction).toUpperCase() === "SHORT" ? "rgba(255,96,117,.10)" : "rgba(49,221,141,.10)";
          ctx.fillRect(x1 - step / 2, pad.top, Math.max(step, x2 - x1 + step), plotH);
          ctx.strokeStyle = dirColor;
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          const angle = Math.atan2(y2 - y1, x2 - x1);
          const head = 18;
          ctx.beginPath();
          ctx.moveTo(x2, y2);
          ctx.lineTo(x2 - head * Math.cos(angle - .48), y2 - head * Math.sin(angle - .48));
          ctx.lineTo(x2 - head * Math.cos(angle + .48), y2 - head * Math.sin(angle + .48));
          ctx.closePath();
          ctx.fillStyle = dirColor;
          ctx.fill();
          ctx.restore();
        }
      }
      if (timeframe === "m5" && Number.isFinite(Number(card.consolidationHigh)) && Number.isFinite(Number(card.consolidationLow))) {
        const start = nearestIndex(card.consolidationStartTime);
        const end = nearestIndex(card.consolidationEndTime);
        if (start >= 0 && end >= start) {
          const high = Number(card.consolidationHigh);
          const low = Number(card.consolidationLow);
          const x1 = xAt(start) - step / 2;
          const x2 = xAt(end) + step / 2;
          const top = y(high);
          const bottom = y(low);
          ctx.save();
          ctx.fillStyle = "rgba(244,189,83,.13)";
          ctx.strokeStyle = "rgba(244,189,83,.96)";
          ctx.lineWidth = 3;
          ctx.setLineDash([12, 8]);
          ctx.fillRect(x1, top, Math.max(step, x2 - x1), Math.max(6, bottom - top));
          ctx.strokeRect(x1, top, Math.max(step, x2 - x1), Math.max(6, bottom - top));
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(244,189,83,.96)";
          ctx.font = "800 22px Inter, system-ui, sans-serif";
          ctx.fillText("base", x1 + 10, Math.max(pad.top + 24, top - 8));
          ctx.restore();
        }
      }
    }
    function drawAll(cards) {
      document.querySelectorAll(".card").forEach((tile) => {
        const index = Number(tile.dataset.index);
        const card = cards[index] || {};
        drawChart(tile.querySelector('canvas[data-timeframe="m15"]'), card.candles15m, card, "m15");
        drawChart(tile.querySelector('canvas[data-timeframe="m5"]'), card.candles5m, card, "m5");
      });
    }
    async function fetchJson(source, stamp) {
      const join = source.url.includes("?") ? "&" : "?";
      const r = await fetch(`${source.url}${join}t=${stamp}`, { cache: "no-store" });
      if (!r.ok) throw new Error(`${source.url} HTTP ${r.status}`);
      if (source.type === "github-api") {
        const payload = await r.json();
        const clean = String(payload.content || "").replace(/\s/g, "");
        const binary = atob(clean);
        const bytes = Uint8Array.from(binary, (ch) => ch.charCodeAt(0));
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      }
      return r.json();
    }
    async function load() {
      try {
        const stamp = Date.now();
        let data = null;
        let lastError = null;
        for (const source of dataSources) {
          try {
            data = await fetchJson(source, stamp);
            break;
          } catch (error) {
            lastError = error;
          }
        }
        if (!data) throw lastError || new Error("data.json unavailable");
        const cards = Array.isArray(data.cards) ? data.cards : [];
        const newCards = getNewCards(cards);
        lastNewSymbols = newCards.map((card) => card.symbol).filter(Boolean);
        renderSummary(data);
        renderCards(cards, lastNewSymbols);
        drawAll(cards);
        notifyNewSymbols(newCards);
      } catch (error) {
        summary.innerHTML = `<div class="pill">Ошибка data.json</div>`;
        grid.innerHTML = `<div class="empty">${error.message}</div>`;
      }
    }
    notifyButton.addEventListener("click", async () => {
      ensureAudio();
      if ("Notification" in window && Notification.permission === "default") {
        await Notification.requestPermission();
      }
      localStorage.setItem(notifyKey, "1");
      playSignal();
      updateNotifyButton();
    });
    window.addEventListener("resize", load);
    updateNotifyButton();
    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
