<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Queue Screener</title>
  <style>
    :root{color-scheme:dark;--bg:#0f1318;--panel:#171d24;--panel2:#111820;--text:#eef3f7;--muted:#92a0ad;--grid:#27313b;--green:#11c48a;--red:#ff4f68;--blue:#50a7ff;--amber:#ffcc5c}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:22px 28px 14px;border-bottom:1px solid var(--grid);background:#10161d;position:sticky;top:0;z-index:2}h1{margin:0 0 10px;font-size:28px;line-height:1.1;letter-spacing:0}.summary{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.pill{border:1px solid var(--grid);background:var(--panel);border-radius:999px;padding:7px 10px}main{padding:20px 28px 32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.tile{min-height:260px;border:1px solid var(--grid);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:8px;padding:16px;position:relative;overflow:hidden}.tile:before{content:"";position:absolute;inset:0;border-left:5px solid var(--blue);opacity:.95;pointer-events:none}.tile.long:before{border-left-color:var(--green)}.tile.short:before{border-left-color:var(--red)}.tileTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}h2{margin:0;font-size:28px;line-height:1;letter-spacing:0}p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.25}.badge{white-space:nowrap;border:1px solid var(--grid);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--text);background:#202833}.badge.retest{border-color:#2f81d0;color:#9fd0ff}.badge.ready,.badge.open{border-color:#d69e2e;color:#ffe08a}.direction{font-size:44px;line-height:1;font-weight:800;margin:16px 0 18px}.long .direction{color:var(--green)}.short .direction{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metrics div,.timeline div{border:1px solid var(--grid);border-radius:6px;padding:9px;background:rgba(255,255,255,.025);min-width:0}span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}strong,b{font-size:15px;font-weight:750;overflow-wrap:anywhere}.timeline{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}footer{color:var(--muted);padding:0 28px 22px;font-size:12px}@media(max-width:640px){header,main,footer{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}h1{font-size:24px}}
  </style>
</head>
<body>
  <header><h1>Crypto Queue Screener</h1><div id="summary" class="summary"></div></header>
  <main><section id="grid" class="grid"></section></main>
  <footer>Sorted by local heat: max(NATR, last 5m range, displacement/4). Data source: Crypto Signal Observer queue export.</footer>
  <script>
    const fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):"-";
    const esc=(v)=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    function cardHtml(c){const dir=c.direction||"";const side=dir.startsWith("SHORT")?"short":dir.startsWith("LONG")?"long":"watch";const badge=c.status==="OPEN_TRADE"?"open":c.status==="SIGNAL_READY"?"ready":c.status==="WAITING_RETEST"?"retest":"watch";return `<article class="tile ${side}"><div class="tileTop"><div><h2>${esc(c.symbol)}</h2><p>${esc(c.pattern||"-")} · ${esc(c.lineMode||"-")}</p></div><span class="badge ${badge}">${esc(c.status||"-")}</span></div><div class="direction">${esc(dir)}</div><div class="metrics"><div><span>NATR</span><strong>${fmt(c.natr)}</strong></div><div><span>5m range</span><strong>${fmt(c.range)}</strong></div><div><span>Impulse</span><strong>${fmt(c.impulse)}%</strong></div><div><span>Displ.</span><strong>${fmt(c.displacement)}%</strong></div><div><span>Vol X</span><strong>${fmt(c.volumeX)}</strong></div><div><span>Width</span><strong>${fmt(c.width)}%</strong></div></div><div class="timeline"><div><span>Breakout</span><b>${esc(c.breakoutTime||"-")}</b></div><div><span>Entry</span><b>${esc(c.entryTime||"-")}</b></div></div></article>`}
    fetch("data.json?ts="+Date.now()).then(r=>r.json()).then(data=>{const cards=(data.cards||[]).sort((a,b)=>(b.heat||0)-(a.heat||0));document.getElementById("summary").innerHTML=[`Updated: ${esc(data.updatedAt||"-")}`,`Symbols: ${cards.length}`,`Watchlist: ${data.watchlistCount||0}`,`Active setups: ${data.setupCount||0}`,`Open paper: ${data.openTradeCount||0}`].map(x=>`<div class="pill">${x}</div>`).join("");document.getElementById("grid").innerHTML=cards.length?cards.map(cardHtml).join(""):"<article class='tile'><h2>Empty</h2><p>No queue symbols.</p></article>"}).catch(e=>{document.getElementById("grid").innerHTML=`<article class='tile'><h2>Error</h2><p>${esc(e.message)}</p></article>`});
  </script>
</body>
</html>
